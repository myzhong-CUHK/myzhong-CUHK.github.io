# 这份文件同时被两个东西读取，两边的要求不一样，改之前先看清楚：
#   1) 网站的 /cv/ 页面      —— al-folio 的 Liquid 模板，比较宽松
#   2) Render a CV 工作流    —— Python 的 rendercv，会严格校验，不合格整个工作流报红
#
# rendercv 的三条硬性要求：
#   · 所有日期只能是 YYYY / YYYY-MM / YYYY-MM-DD / present，写 "Aug 2024" 会直接报错
#   · cv: 根层不能有 label / image / address 这三个字段
#   · 条目里的额外字段必须是字符串，纯数字要加引号（如 releaseDate: "2026"）
#
# YAML 通则：值里出现「冒号 + 空格」或 "#"，整条必须加英文双引号。

